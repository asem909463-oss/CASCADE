name: CASCADE CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Game engine tests
        run: npm test
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist

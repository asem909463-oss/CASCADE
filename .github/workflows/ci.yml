name: CASCADE CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log('Vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, issue] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + issue.severity + '; direct=' + issue.isDirect + '; fix=' + JSON.stringify(issue.fixAvailable));"
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: Game engine tests
        run: npm test
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist
